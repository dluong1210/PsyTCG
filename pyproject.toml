[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psytcg"
version = "1.0.0"
description = "Role-asymmetric temporal conversation graphs for depression detection"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
preprocess = ["transformers>=4.38", "nltk>=3.8", "pyarrow>=14.0"]
gat-baseline = ["torch-geometric>=2.5"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
psytcg-build-graphs = "data_processing.build_graph_pkl:main"
psytcg-train = "training.train_psytcg:main"
psytcg-train-gat = "training.train_gat_tlstm:main"
psytcg-infer = "infer.infer_psytcg:main"
psytcg-infer-gat = "infer.infer_gat_tlstm:main"
psytcg-evaluate = "evaluation.evaluate_psytcg:main"
psytcg-evaluate-gat = "evaluation.evaluate_gat_tlstm:main"
psytcg-evaluate-llm = "evaluation.evaluate_llm:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "data_processing*", "evaluation*", "infer*", "model*", "training*", "utils*"]

[tool.setuptools.package-data]
config = ["*.yaml", "*.md"]
data_processing = ["README.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
